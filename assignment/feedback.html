<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">My Website</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link active" href="feedback.html">Feedback</a></li>
            <li class="nav-item"><a class="nav-link" href="photos.html">Photos</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="page-card">
      <section class="hero">
        <h1 id="feedback-title">Feedback Form</h1>
      </section>

      <section class="content-area">
        <h2 class="sticky-heading">Feedback Section</h2>
        <div class="content-box">
          <p>
            Please share your thoughts about this webpage and the projects you enjoy.
          </p>
          <form>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter your name" />

            <label for="message">Message</label>
            <textarea id="message" rows="4" placeholder="Write your feedback"></textarea>

            <button type="submit">Submit Feedback</button>
          </form>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
