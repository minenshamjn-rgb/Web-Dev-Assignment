<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="feedback.html">Feedback</a>
    </nav>

    <main class="page-card">
      <section class="hero">
        <h1 id="feedback-title">Feedback Form</h1>
      </section>

      <section class="content-area">
        <h2 class="sticky-heading">Feedback Section</h2>
        <div class="content-box">
          <p>
            Please share your thoughts about this webpage and the projects you enjoy.
          </p>
          <form>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter your name" />

            <label for="message">Message</label>
            <textarea id="message" rows="4" placeholder="Write your feedback"></textarea>

            <button type="submit">Submit Feedback</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
